<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
body, html { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
iframe, video { width:100%; height:100%; border:none; position:absolute; top:0; left:0; }
.hide { display: none !important; }
</style>
</head>
<body>
<iframe id="iframe_player" width="100%" height="100%" frameborder="0" style="border-radius: 12px;" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen class="hide"></iframe>
<video id="local_video" autoplay playsinline controls class="hide"></video>

<script>
  var _t = '', _m = '', _sn = 0, _ep = 0, _tv = false, _resumeTime = 0;

  function startPlayer() {
      var iframe = document.getElementById('iframe_player');
      iframe.classList.remove('hide');
      var url = '';
      if (_tv) {
          url = 'https://peachify.top/embed/tv/' + _m + '/' + _sn + '/' + _ep;
      } else {
          url = 'https://peachify.top/embed/movie/' + _m;
      }
      
      if (_resumeTime > 0) {
          url += '?startAt=' + Math.floor(_resumeTime) + '&autoPlay=1&dub=Hindi&sub=Hindi';
      } else {
          url += '?autoPlay=1&dub=Hindi&sub=Hindi';
      }
      
      iframe.src = url;
      
      if (window.AndroidBridge && _t) {
          AndroidBridge.cacheResult(_t, 'peachify', _m, _tv, _sn, _ep);
      }
  }

  window.addEventListener('message', (event) => {
      if (event.origin !== 'https://peachify.top') return;
      
      if (event.data?.type === 'MEDIA_DATA') {
          // You could optionally cache this if needed
      }

      if (event.data?.type === 'PLAYER_EVENT') {
          const playerEvent = event.data.data.event;
          const currentTime = event.data.data.currentTime;
          
          if (playerEvent === 'timeupdate' && window.AndroidBridge && _t) {
              AndroidBridge.saveProgress(_t, currentTime);
          }
      }
  });

  // For local files
  var V = document.getElementById('local_video');
  V.addEventListener('timeupdate', function() {
      if (window.AndroidBridge && _t && V.currentTime > 0) {
          // handled below
      }
  });
  
  var _saveCounter = 0;
  V.addEventListener('timeupdate', function() {
      _saveCounter++;
      if (_saveCounter % 25 === 0 && _t && window.AndroidBridge) {
          AndroidBridge.saveProgress(_t, V.currentTime);
      }
  });
</script>
</body>
</html>
